name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff black pytest pandas faker

      - name: Lint with ruff
        run: ruff check pipeline/ dags/ data_gen/ tests/

      - name: Check formatting with black
        run: black --check pipeline/ dags/ data_gen/ tests/

      - name: Run tests
        run: pytest tests/ -v
